<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RMC Task Status</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --line: #e3e7ec; --head: #f0f2f5;
    --done-bg: #e3f6ea; --done-fg: #17683a; --hold-bg: #fff3d6; --hold-fg: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #181c21; --text: #e6e9ee; --muted: #9aa5b3; --line: #2a3038; --head: #1f242b;
      --done-bg: #12351f; --done-fg: #7fdca0; --hold-bg: #3a2e10; --hold-fg: #f2c45a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { margin: 0 0 20px; color: var(--muted); }
  .totals { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  .total { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; min-width: 150px; }
  .total b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .total span { color: var(--muted); font-size: 13px; }
  .wrap { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { background: var(--head); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); position: sticky; top: 0; }
  tr:last-child td { border-bottom: 0; }
  td.num { width: 48px; font-weight: 600; font-variant-numeric: tabular-nums; }
  td.task { width: 230px; font-weight: 600; }
  td.status { width: 120px; }
  .ask { margin: 0; }
  .built { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .built b { color: var(--text); font-weight: 600; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .pill.done { background: var(--done-bg); color: var(--done-fg); }
  .pill.hold { background: var(--hold-bg); color: var(--hold-fg); }
  .note { margin-top: 16px; color: var(--muted); font-size: 13px; }
  @media (max-width: 700px) { td.task { width: auto; } th, td { padding: 10px; } }
</style>
</head>
<body>
<main>
  <h1>RMC Task Status</h1>
  <p class="sub">The owner's task list · updated 12 November 2026</p>

  <div class="totals">
    <div class="total"><b id="count-done">0</b><span>Done</span></div>
    <div class="total"><b id="count-hold">0</b><span>On hold</span></div>
    <div class="total"><b id="count-all">0</b><span>Tasks in total</span></div>
  </div>

  <div class="wrap">
    <table>
      <thead><tr><th>#</th><th>Task</th><th>Description</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="note">"Done" means built and tested. Changes go live with the next update of the server.</p>
</main>

<script>
const TASKS = [
  { id: '1', title: 'Same student count everywhere', status: 'done',
    ask: 'Students page, owner panel and finance showed different totals (1267 vs 1314). All screens must show one number.',
    built: 'One counting rule for every screen: each student once, without deleted or transferred records.' },
  { id: '2', title: 'HR section (Staff and Teachers)', status: 'hold',
    ask: 'Replace the Teachers section with an HR section holding Staff (cleaners, admins and others) and Teachers, with full details and salaries.',
    built: 'Put on hold until further notice.' },
  { id: '3', title: 'Points ranking counted per subject', status: 'done',
    ask: 'A student who studies two subjects must not get both subjects\' points added together. Each subject is ranked on its own.',
    built: 'The ranking counts each student separately in each group.' },
  { id: '4', title: 'Full marks for everyone, and Stellar student', status: 'done',
    ask: 'Allow the top score for every student. A separate "Stellar student of the lesson" mark gives coins but no points, at most 5 per lesson.',
    built: '"Excellent" is the top activity level and works with "Fill all". Stellar is a separate mark that gives coins only, limited to 5 students per lesson.' },
  { id: '5', title: 'Absent students skip homework and activity', status: 'done',
    ask: 'Absent students should not appear for homework and activity. Unexcused absence gets a red 0; excused absence gets 50 points.',
    built: 'Absent students are skipped in homework and activity; unexcused gets 0 in red, excused gets 50 automatically.' },
  { id: '6', title: '100-point score saved exactly', status: 'done',
    ask: 'With the 100-point score, 80 must stay 80 and 99 must stay 99. Attendance is not required: a 0 means absent and shows in red.',
    built: 'The score is saved exactly as typed, and a 0 marks the student absent.' },
  { id: '7', title: 'Payments for transferred students', status: 'done',
    ask: 'When a student moves to another teacher mid-month and pays for the whole month, the payment is split so the first teacher gets their share.',
    built: 'Each payment is split between the old and the new group by the lessons taught in each (price ÷ 12 per lesson).' },
  { id: '8', title: 'Sorting in teacher lists', status: 'done',
    ask: 'Sort teachers by number of groups, subject, number of students, salary or alphabet, everywhere teachers are listed.',
    built: 'All of these sort options are available in every teacher list.' },
  { id: '9', title: 'Standard student data; subjects with levels and prices', status: 'done',
    ask: 'Type only numbers for school, class and age; phone starts with +998; gender from a list. Subjects have levels with monthly prices; groups pick a level.',
    built: '"-Maktab", "-Sinf" and "+998" are added automatically; searching school 7 no longer finds 97 or 37; level filters in student and group lists.' },
  { id: '10', title: 'Leads: new group by subject', status: 'done',
    ask: 'In the leads "new group" section, choose a subject and see only those students and how many are gathered.',
    built: 'Subject tabs with a student count for each subject.' },
  { id: '11', title: 'Waiting for a group: subject and level filter', status: 'done',
    ask: 'Show the waiting list per subject and allow filtering by level.',
    built: 'Subject and level filters; the level is chosen from the subject\'s levels.' },
  { id: '12', title: 'Graduates and certificates', status: 'done',
    ask: 'Certificates in Archive → Graduates with links, search by name and date, download, thank-you screenshots, and graduate statistics by month and teacher.',
    built: 'Certificates, university admissions and thank-you notes (PDF, picture or link) with dates; filter by year and month; new "Graduates" report with this year against last year, by month and by teacher.' },
  { id: '13a', title: 'Retention: teachers ranked by students lost', status: 'done',
    ask: 'Rank every teacher by percent of students lost. Leavers grouped into trial, new group, long-term, graduated and transferred; only the first three count against the teacher.',
    built: 'Five leaving groups, teachers ranked by percent lost, filters by teacher, subject and level.' },
  { id: '13b', title: 'Admissions against students lost', status: 'done',
    ask: 'Each month show new students against students lost (without transfers), how many each teacher admitted, and whether they came for a teacher or the center.',
    built: 'Monthly balance (for example +40 or −30), admissions per teacher, and came for a teacher vs. for the center.' },
  { id: '14', title: 'Teacher KPI', status: 'done',
    ask: 'A monthly KPI with 7 parts: retention, students who came asking for the teacher, average lesson score, contribution, exam score, teaching quality, late-scoring penalty. Monthly and year ranking.',
    built: 'All seven parts, ranking for the month and the year, and the owner can enter scores.' },
  { id: '15', title: 'Timetable from groups; group search', status: 'done',
    ask: 'The calendar follows each group\'s days, times and dates. Search groups by level, odd/even days and session, with the emptiest groups first.',
    built: 'Group finder by level, days, morning/afternoon and start time, most free places first. The calendar rebuilds itself when the timetable or dates change.' },
  { id: '16', title: 'Daily KPI minus for missed scoring', status: 'done',
    ask: 'Each day a teacher does not score a lesson takes KPI points off, adding up day by day.',
    built: 'Minus 5 points for each day a lesson stays unscored, shown in lesson control and the KPI.' },
  { id: '17', title: 'Rooms: fix "room is busy"; one timetable', status: 'done',
    ask: 'Assigning a group to a free room said it was busy. Clear old calendar lessons and keep one timetable.',
    built: 'Deleted and finished groups no longer block a room; a button rebuilds every group\'s calendar from the timetable.' },
  { id: '18', title: 'Payment statistics: this month\'s totals', status: 'done',
    ask: 'Show amount paid, amount to collect, percent collected and percent unpaid this month, and the percent of teachers already paid.',
    built: 'New monthly totals block replaces the old numbers.' },
  { id: '19', title: 'Debts by month', status: 'done',
    ask: 'Show students who still owe for earlier months. Choosing a month shows everyone who did not pay that month.',
    built: 'Month picker listing every unpaid student with full details.' },
];

const LABEL = { done: 'Done', hold: 'On hold' };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

document.getElementById('rows').innerHTML = TASKS.map((t) => `<tr>
  <td class="num">${t.id}</td>
  <td class="task">${esc(t.title)}</td>
  <td><p class="ask">${esc(t.ask)}</p><p class="built"><b>${t.status === 'done' ? 'Built:' : 'Note:'}</b> ${esc(t.built)}</p></td>
  <td class="status"><span class="pill ${t.status}">${LABEL[t.status]}</span></td>
</tr>`).join('');

document.getElementById('count-done').textContent = TASKS.filter((t) => t.status === 'done').length;
document.getElementById('count-hold').textContent = TASKS.filter((t) => t.status === 'hold').length;
document.getElementById('count-all').textContent = TASKS.length;
</script>
</body>
</html>
